manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Heartwood
version: "0.2.3"
tagline: Self-hosted Bitcoin command center
description: >-
  Heartwood is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  Fixed a bug introduced in 0.2.2 where the new security headers blocked the
  app's own startup script, so pages could load but never become interactive.
  The fix uses the browser's per-request nonce mechanism instead of a static
  policy, closing the gap without weakening the protection.


  Perf: the navigation bar now caches its per-user data for a few seconds
  instead of re-querying on every click (most noticeable on Umbrel's
  Raspberry Pi hardware), and the transaction-detail and stateless-signer
  pages load slightly faster by running their chain lookups in parallel
  instead of one after another.


  No data migration — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.2.3

developer: Alex Martinez
website: https://github.com/AlexM223/cairn
dependencies: []
repo: https://github.com/AlexM223/cairn
support: https://github.com/AlexM223/cairn/issues

port: 3211
gallery:
  - https://raw.githubusercontent.com/AlexM223/cairn/main/docs/screenshots/dashboard.png
  - https://raw.githubusercontent.com/AlexM223/cairn/main/docs/screenshots/wallets.png
  - https://raw.githubusercontent.com/AlexM223/cairn/main/docs/screenshots/multisig-wallet.png
  - https://raw.githubusercontent.com/AlexM223/cairn/main/docs/screenshots/send-review.png
path: ""
icon: https://raw.githubusercontent.com/AlexM223/cairn/main/src/lib/assets/favicon.svg

defaultUsername: admin@cairn.local
deterministicPassword: true
defaultPassword: ""

