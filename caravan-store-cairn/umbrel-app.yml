manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Cairn
version: "0.1.8"
tagline: Self-hosted Bitcoin command center
description: >-
  Cairn is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  The secure address (https://umbrel.local:3212) now opens itself: once
  you've accepted its certificate, any page you open on the regular address
  quietly continues on the secure one — signed in, same page, hardware
  signing and camera scanning ready. First-time visitors still get the
  guided walkthrough, and signing in directly on the secure address (which
  could show a server error before) now works.


  The secure address also no longer appears dead right after an update or
  restart — it answers immediately with a "starting up" page that hands
  over to the app within seconds. Its certificate is generated to modern
  standards now and replaced automatically on first start, so expect one
  fresh "connection is not private" browser warning after this update;
  accept it once and you're set.


  Adding a wallet is three steps instead of six: paste (or read) your key,
  check the addresses, name it — done. Pasted keys are no longer asked
  which device holds them; you pick how to sign when you actually send.


  No data changes — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.1.8

developer: Alex Martinez
