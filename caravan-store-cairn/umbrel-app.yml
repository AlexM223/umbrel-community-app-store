manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Cairn
version: "0.1.6"
tagline: Self-hosted Bitcoin command center
description: >-
  Cairn is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  Hardware wallet signing now works from your browser. Ledger, BitBox02,
  and Jade USB signing (plus camera QR scanning) need a secure connection,
  which Umbrel's regular http:// address can't provide — so Cairn now
  serves its own secure address at https://umbrel.local:3212, and every
  signing screen links you there when it's needed.


  Your browser will warn about the self-signed certificate the first time
  (and again roughly weekly — that's normal, the app walks you through it).
  Sign in with your password on the secure address; passkeys don't work
  there.


  Trezor — and BitBox02, if you have the BitBoxBridge app installed on
  your computer — can now also connect on the regular address.


  Also fixed: the wallet-setup wizard no longer shows a link that could
  accidentally exit setup partway through.


  No data changes — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.1.6

developer: Alex Martinez
website: https://github.com/AlexM223/cairn
