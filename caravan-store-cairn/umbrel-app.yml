manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Cairn
version: "0.1.9"
tagline: Self-hosted Bitcoin command center
description: >-
  Cairn is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  A full visual redesign, inside the app: Cairn now goes by "Heartwood" on
  every screen, with a new dark copper-and-ring design built around growth
  rings — confirmations, node sync, block history, and multisig quorum all
  read as rings, arcs, or dials now instead of badges and bars. Every page
  (send, sign, receive, wallets, explorer, activity, admin, settings) has
  been rebuilt, on both desktop and phone widths.


  A new first-run screen shows your node catching up ring by ring, with a
  short historical note for each year as it verifies.


  Nothing about how the app talks to your node, your hardware wallet, or
  your keys has changed — this is a visual and in-app naming update only.
  This Umbrel listing, its app ID, and your data are unaffected.


  No data changes — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.1.9

