manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Heartwood
version: "0.2.5"
tagline: Self-hosted Bitcoin command center
description: >-
  Heartwood is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  Fixed the app feeling slow or unresponsive on Umbrel. Opening your wallet
  list used to kick off a separate background check for every single wallet
  all at once, which could overload the connection to your Bitcoin server and
  make the whole app feel stuck. It now runs one coordinated check instead, so
  things stay snappy no matter how many wallets you have.


  Fixed a bug where, if that first check happened to fail, your balance could
  briefly flash as zero instead of showing that it was still syncing — an
  alarming thing to see on a Bitcoin wallet, and now it correctly shows the
  syncing state.


  Opening a transaction from the block explorer no longer hangs if the server
  is slow to respond.


  No data migration — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.2.5

developer: Alex Martinez
website: https://github.com/AlexM223/cairn
dependencies: []
