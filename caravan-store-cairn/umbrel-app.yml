manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Heartwood
version: "0.2.8"
tagline: Self-hosted Bitcoin command center
description: >-
  Heartwood is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  First of several planned releases removing Cairn's dependency on a
  third-party public indexer for chain data. Fee estimates, the recent-blocks
  list, network difficulty/hashrate, and address lookups used to be fetched
  from a public service that self-hosted setups often can't reach from
  inside their Docker container — those screens could fail outright. They
  now come straight from your own Electrum server connection instead, with
  zero third-party dependency.


  There's also a new "Bitcoin Core RPC" section in Admin → Settings with a
  connection test, for operators who want to point Cairn at their own
  Bitcoin Core node.


  Known limitation: block detail pages, transaction detail pages, and the
  mempool summary are still backed by the public indexer and may still fail
  without internet access from the container — that migration is planned
  for a follow-up release.


  No data migration — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.2.8

