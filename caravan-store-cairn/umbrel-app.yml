manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Cairn
version: "0.1.3"
tagline: Self-hosted Bitcoin command center
description: >-
  Cairn is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install, then change the
  password (and set your real email address, so notifications reach you)
  from Settings.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  Imported wallets now chart their balance history from day one — the
  "Balance over time" chart is filled in from the wallet's existing
  transactions instead of starting empty. Creating or importing a wallet
  now shows up in your activity feed and the admin log. And if a login
  succeeds but your browser can't keep the session cookie, the sign-in
  page says so clearly instead of silently reloading.


  Also includes 0.1.2's fixes if you're updating straight from 0.1.1:
  the add-wallet wizard no longer loses its place when the page reloads
  mid-setup, and Umbrel's dashboard login wall no longer intercepts
  Cairn (it has its own login).


  No data changes — safe update from 0.1.2 or 0.1.1. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.1.3

developer: Alex Martinez
website: https://github.com/AlexM223/cairn
