manifestVersion: 1
id: caravan-store-cairn
category: bitcoin
name: Heartwood
version: "0.2.2"
tagline: Self-hosted Bitcoin command center
description: >-
  Heartwood is a self-hosted, watch-only Bitcoin wallet navigator and block
  explorer you run yourself. It never touches your private keys — signing
  happens on your hardware wallet (Trezor, Ledger, BitBox02, Jade, Coldcard)
  or is coordinated as a multisig quorum.


  Log in with the email and password shown after install — you'll be asked
  to set your own password and a real email address (so notifications can
  reach you) the first time you sign in.


  Works out of the box against a public Electrum server; point it at your
  own Electrum server (e.g. the electrs app) from Admin → Settings for full
  self-sovereignty.


  Passkey login requires HTTPS — on Umbrel's default .local address, use
  password login.
releaseNotes: >-
  Security: fixed an unauthenticated admin bypass (with a crash guard on the
  affected path), added CSP/HSTS/X-Frame-Options response headers, removed a
  passkey-reclaim account-takeover path in favor of a proper recovery-password
  flow, and closed an open-redirect in login.


  Multisig: hardened cleanup so deleting a wallet or vault reliably clears its
  backups/labels/notification state, fixed a BIP-48 P2SH derivation-path
  mismatch, and extended "resume after reload" to the multisig setup wizard.


  Also: hardware-signer calls now time out with a recoverable error instead of
  hanging, several background-race fixes (broadcast/watcher), faster nav and
  login, and a reliability pass on notifications and Electrum reconnects.


  No data migration — safe update from any earlier version. Full notes:
  https://github.com/AlexM223/cairn/releases/tag/v0.2.2

developer: Alex Martinez
website: https://github.com/AlexM223/cairn
dependencies: []
repo: https://github.com/AlexM223/cairn
