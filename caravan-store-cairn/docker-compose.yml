services:
  app_proxy:
    environment:
      APP_HOST: caravan-store-cairn_web_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/alexm223/cairn:0.2.2@sha256:1cd6bb1b08bd975baf8f22f1145f593e14768076e4710b756d1442a71b7f3073
    restart: on-failure
    user: "1000:1000"
    ports:
      # Cairn's own self-signed HTTPS listener (cairn-wgr8), bypassing
      # app_proxy: https://umbrel.local:3212 is a browser "secure context", so
      # WebHID/Web Serial hardware signing and camera QR scanning work there —
      # plain-HTTP app_proxy access can't offer them. The cert is generated at
      # first boot into the app's data volume; browsers warn once (self-signed)
      # and the in-app help walks the user through it.
      - "3212:3443"
    environment:
      # app_proxy sets/overwrites X-Forwarded-For, so it is safe to trust here.
      ADDRESS_HEADER: x-forwarded-for
      # app_proxy also sets X-Forwarded-Proto. Without this, adapter-node
      # ASSUMES https, marks the session cookie Secure (browsers on plain
      # http silently drop it — login goes nowhere), and 403s form actions
      # as cross-site.
      PROTOCOL_HEADER: x-forwarded-proto
      # Absolute origin used in notification email links and as the WebAuthn
      # origin fallback — declare it rather than trusting per-request headers.
      CAIRN_ORIGIN: "http://${DEVICE_DOMAIN_NAME}:${APP_PROXY_PORT}"
      # First-boot admin bootstrap: creates admin@cairn.local with Umbrel's
      # per-install derived password (shown in the Umbrel UI via
      # deterministicPassword). Never overwrites a password the user changed.
      CAIRN_ADMIN_PASSWORD: ${APP_PASSWORD}
      # The HTTPS listener's host-visible port (the 3212 side of the ports
      # mapping above) — what the app's "open the secure address" links use.
      CAIRN_HTTPS_EXTERNAL_PORT: "3212"
    volumes:
      - ${APP_DATA_DIR}/data:/data
