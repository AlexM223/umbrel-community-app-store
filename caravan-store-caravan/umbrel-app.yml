manifestVersion: 1
id: caravan-store-caravan
category: bitcoin
name: Caravan
version: "1.19.5"
tagline: Stateless multisig coordinator for your Bitcoin node
description: >-
  Caravan is a fully open-source, stateless Bitcoin multisig coordinator. Build
  and manage multisig wallets (2-of-3, 3-of-5, ...), coordinate PSBTs, and use
  hardware wallets - without storing any keys.

  Wired to your Umbrel Bitcoin node automatically: import any wallet config
  (even ones without client info) and Caravan connects through the app's
  built-in node proxy, creates a watch-only wallet on your node, imports your
  addresses, and scans the chain for your history on first use - no
  credentials, URLs, or config editing needed.

  Note: the proxy is reachable by anyone on your local network and forwards
  authenticated RPC to your node (same trust model as your node's LAN-exposed
  RPC port). Caravan may create a watch-only wallet on the node for address
  tracking; this never holds private keys.
developer: Caravan (Unchained / community)
website: https://www.caravanmultisig.com
dependencies:
  - bitcoin
repo: https://github.com/AlexM223/caravan
support: https://github.com/caravan-bitcoin/caravan/issues
port: 4242
gallery:
  - https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/apps/coordinator/public/images/landing/caravan-balance.webp
  - https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/apps/coordinator/public/images/landing/xpubs.webp
  - https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/apps/coordinator/public/images/landing/stateless.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Wallet isolation fix: each wallet config now gets its OWN watch-only node
  wallet (caravan-<hash>, derived deterministically from the config) instead
  of one shared wallet. Bitcoin Core cannot remove imported descriptors, so
  the previous shared wallet accumulated addresses from every config you
  tried - making one wallet's session show another wallet's
  addresses/balances. Re-importing the same config reuses its wallet (no
  repeat rescan); an explicit client.walletName is still honored. Node
  wallets are also no longer touched until you click Confirm (connection
  tests are reachability-only), and the confirm screen shows the node wallet
  name with the option to edit it. Note: a previously-shared "caravan-main"
  wallet on your node may contain mixed descriptors - unload it
  (bitcoin-cli unloadwallet "caravan-main") if you used earlier versions.
  The app image is built on-device at install time from
  https://github.com/AlexM223/caravan.git#umbrel.
icon: https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/assets/images/caravan-logo-transparent.png
submitter: Alex
submission: https://github.com/AlexM223/umbrel-community-app-store
