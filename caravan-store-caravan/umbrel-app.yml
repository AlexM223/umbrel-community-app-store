manifestVersion: 1
id: caravan-store-caravan
category: bitcoin
name: Caravan
version: "1.19.7"
tagline: Stateless multisig coordinator for your Bitcoin node
description: >-
  Caravan is a fully open-source, stateless Bitcoin multisig coordinator. Build
  and manage multisig wallets (2-of-3, 3-of-5, ...), coordinate PSBTs, and use
  hardware wallets - without storing any keys.

  Wired to your Umbrel Bitcoin node automatically: import any wallet config
  (even ones without client info) and Caravan connects through the app's
  built-in node proxy, creates a watch-only wallet on your node, imports your
  addresses, and scans the chain for your history on first use - no
  credentials, URLs, or config editing needed.

  The app and its node proxy sit behind your Umbrel login: only someone
  signed in to your Umbrel dashboard can reach them. Caravan may create a
  watch-only wallet on the node for address tracking; this never holds
  private keys.
developer: Caravan (Unchained / community)
website: https://www.caravanmultisig.com
dependencies:
  - bitcoin
repo: https://github.com/AlexM223/caravan
support: https://github.com/caravan-bitcoin/caravan/issues
port: 4242
gallery:
  - https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/apps/coordinator/public/images/landing/caravan-balance.webp
  - https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/apps/coordinator/public/images/landing/xpubs.webp
  - https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/apps/coordinator/public/images/landing/stateless.webp
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Security hardening, no app code changes. The app now sits behind your
  Umbrel login (the standard Umbrel auth wall): previously, anyone on your
  local network could reach the app and query your Bitcoin node through its
  built-in RPC proxy without credentials. After this update you must be
  signed in to your Umbrel dashboard to use Caravan - there is nothing else
  to configure. If you used command-line diagnostics against the /bitcoind
  proxy, those now require a signed-in browser session too. The app build is
  unchanged (same 1.19.6 code, now pinned to an exact commit of
  https://github.com/AlexM223/caravan.git so installs always build exactly
  the code this version claims).
icon: https://raw.githubusercontent.com/caravan-bitcoin/caravan/main/assets/images/caravan-logo-transparent.png
submitter: Alex
submission: https://github.com/AlexM223/umbrel-community-app-store
