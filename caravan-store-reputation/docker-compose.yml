version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: caravan-store-reputation_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    build:
      context: http://umbrel.local:8085/caravan-store/reputation-scanner.git#main
      dockerfile: Dockerfile.umbrel
    restart: on-failure
    stop_grace_period: 1m
    environment:
      # Local mempool backend (from the `mempool` dependency) — nginx proxies /api/ here.
      APP_MEMPOOL_IP: ${APP_MEMPOOL_API_IP}
      APP_MEMPOOL_PORT: ${APP_MEMPOOL_API_PORT}
      # The upstream nginx template references these; set to harmless literals so
      # envsubst yields a valid config (the /tor-proxy path is unused by this app).
      APP_TOR_PROXY_IP: "127.0.0.1"
      APP_TOR_PROXY_PORT: "9999"
      APP_MEMPOOL_HIDDEN_SERVICE: ""
      APP_MEMPOOL_EXTERNAL_URL: ""
